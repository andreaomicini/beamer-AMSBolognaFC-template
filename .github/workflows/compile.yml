name: compile
on:
  push:
    branches:
      - main
      - master

env:
  LATEX_ROOT: AMSBolognaFC-template

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Style lag (a warning when .style is behind its style's main)
        run: |
          curl -fsSL https://raw.githubusercontent.com/andreaomicini/beamer-AMSUniBo/main/ci/style-lag.sh -o /tmp/style-lag.sh || { echo "::warning title=style-lag::could not fetch ci/style-lag.sh"; exit 0; }
          rc=0; out=$(sh /tmp/style-lag.sh) || rc=$?
          echo "$out"
          if [ "$rc" -eq 3 ]; then echo "::warning title=style-lag::$(echo "$out" | head -1)"; elif [ "$rc" -ne 0 ]; then echo "::warning title=style-lag::the check could not run (exit $rc)"; fi

      - name: Build latex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ env.LATEX_ROOT }}.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -shell-escape

      - name: Compute version
        id: get-version
        run: |
          BASE="$(python3 .github/scripts/compute-version.py ${LATEX_ROOT}.tex)"
          STAMP="$(date -u +'%Y-%m-%dT%H%M%S')"
          echo "version=${BASE}" >> "$GITHUB_OUTPUT"
          echo "tag=${BASE}-${STAMP}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get-version.outputs.tag }}
        run: |
          cp "${LATEX_ROOT}.pdf" "${LATEX_ROOT}-${TAG}.pdf"
          gh release create "${TAG}" "${LATEX_ROOT}-${TAG}.pdf" \
            --title "${TAG}" \
            --notes "AMSBolognaFC Beamer template ${{ steps.get-version.outputs.version }}, released from ${GITHUB_SHA}."
